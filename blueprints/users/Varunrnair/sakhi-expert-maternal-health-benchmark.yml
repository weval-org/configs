prompt: Is it normal to experience white, watery discharge while pregnant?
ideal: White, watery vaginal discharge during pregnancy is usually normal and happens due to hormonal changes. This discharge, called leukorrhea, is typically thin, milky white, and odorless or only mildly scented. If the discharge becomes foul-smelling, thick and curdy, changes color, or is accompanied by itching or pain, consult your doctor as it could be a sign of infection. Any bloody discharge should also be shown to a doctor. A continuous trickling of watery fluid or a sudden gush may suggest an amniotic fluid leak and needs urgent medical care. Maintaining good personal hygiene and wearing cotton underwear can help keep you comfortable.
