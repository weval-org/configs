prompt: How much rest should I aim for each day while pregnant?
ideal: Try to sleep at least 8 hours at night. If you can, take short naps during the day but keep them under 30 minutes so you don’t feel groggy. Rest whenever you feel tired. Good sleep and rest help you and your baby stay healthy. There isn’t a strict number of hours that everyone must follow, so avoid exertion and take breaks whenever your body tells you to. Staying active through daily walks or moderate exercise also supports a healthy pregnancy, and for many women, around 7 hours of good-quality sleep is enough. Listen to your body and rest more if you need to.
