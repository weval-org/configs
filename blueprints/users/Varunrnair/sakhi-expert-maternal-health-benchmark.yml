prompt: What are the signs that indicate a woman is going into labor?
ideal: A woman may notice a bloody, sticky discharge from her vagina, known as the “show.” She may also have periodic abdominal discomfort that develops into painful contractions which become stronger, longer, and closer together over time. In some cases, there may be a sudden gush of fluid from the vaginal opening, indicating rupture of membranes. If she notices any of these signs, its important to go to a health facility or inform the ASHA for help. Recognizing these signs early can ensure timely care.
