prompt: During pregnancy, what can I do to manage constipation without using strong medicines?
ideal: Constipation is quite common during pregnancy. To manage it, drink plenty of water and eat a diet rich in fiber, including whole grains, fruits, and vegetables. You can also include sources of soluble fiber, such as chia seeds, and dairy products like milk and curd to help soften stools. Regular light exercise, such as walking or gentle yoga, can aid digestion. If constipation persists, consult your healthcare provider before taking any laxatives.
