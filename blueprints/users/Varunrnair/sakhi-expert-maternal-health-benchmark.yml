prompt: How do I know when my baby is due?
ideal: To know when your baby is coming, we start by knowing when your last period started. We count nine months from the first day of your last period. This is when your baby will most likely be ready to meet the world! We call this your Expected Date of Delivery or EDD. Doctors often use the Naegle’s formula—LMP plus nine months and seven days—to calculate this more precisely, and it is generally quite accurate. Remember, its just an estimate, and babies sometimes come a little earlier or later. But knowing this date helps us plan and take good care of you and your baby.
