prompt: What causes morning sickness, and when does it typically occur during pregnancy?
ideal: Morning sickness is caused by hormonal changes during pregnancy and usually starts around the 6th week, often peaking between the 8th and 10th weeks. It typically appears in the 2nd and 3rd months and usually subsides by the 4th month. Most women experience nausea and sometimes vomiting, which can be managed by eating small, frequent meals and avoiding strong smells. If you have severe vomiting and can’t keep food down, see your doctor.
