prompt: I heard about a disease called TB. My neighbors daughter has it. Im pregnant, should I be worried?
ideal: If someone around you has TB, the risk depends mainly on how closely and how often you are in contact with them. Because TB spreads through the air, it’s safest to get checked by a doctor if you spend regular time near the person who is infected. The doctor may recommend a simple screening test, even if you don’t have symptoms. If the test is positive but you don’t have active disease, preventive medicines can protect both you and your baby. Early evaluation and treatment make TB highly manageable during pregnancy.
