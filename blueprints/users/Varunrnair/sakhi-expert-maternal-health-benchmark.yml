prompt: How often should I feed my baby, and what signs indicate they are hungry?
ideal: Feed your baby every 2–4 hours, including at night, or whenever your baby cries, sucks on hands, or makes sucking motions with the mouth. Babies show hunger by turning their head, making sucking sounds, or being fussy. Breast milk is best and should be given exclusively for the first six months, unless otherwise recommended by a health professional. Do not give water, honey, or other foods during this period. If your baby is not feeding well, seems weak, or you notice unusual behavior, consult a health worker promptly.
