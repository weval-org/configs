prompt: What are common health problems during pregnancy, and how can I prevent them?
ideal: Some disorders like diabetes, high blood pressure, or thyroid problems can worsen during pregnancy, and new conditions such as gestational diabetes or pregnancy-induced hypertension can also develop. Issues like morning sickness, undernutrition, or obesity may further increase the risk of complications. To stay healthy, eat a balanced diet, maintain a healthy weight, and attend regular check-ups so healthcare professionals can identify and manage these problems early. Avoid alcohol, tobacco, and drugs, especially during the first few weeks of pregnancy, as they can harm both the mother and the baby.
