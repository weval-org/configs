prompt: Should I avoid caffeine completely, or is a little okay?
ideal: You do not need to avoid caffeine completely during pregnancy, but limit tea, coffee, and cola to no more than 1–2 small cups a day, which is about 200 mg of caffeine. This amount is considered safe in pregnancy. Having too much caffeine may increase the risk of miscarriage, low birth weight, or other problems. Some herbal teas also contain caffeine, so check the ingredients if you’re unsure, and ask your doctor or health worker if you need guidance.
