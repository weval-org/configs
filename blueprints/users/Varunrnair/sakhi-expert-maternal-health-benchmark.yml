prompt: What should I do if I have a medical condition before getting pregnant?
ideal: If you have conditions such as diabetes, high blood pressure, or thyroid disorders, it is essential to consult a doctor before planning a pregnancy. Pre-pregnancy counselling allows your healthcare provider to stabilise these conditions, adjust medications, and recommend lifestyle changes that support a healthier pregnancy. You may be advised to use contraception until your health is well controlled. Early medical evaluation and proper management greatly reduce the risk of complications and help ensure the well-being of both mother and baby once pregnancy begins.
