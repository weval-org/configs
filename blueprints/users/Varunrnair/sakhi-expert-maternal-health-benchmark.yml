prompt: What is the best position for sleeping while pregnant?
ideal: Sleep on your left side with a pillow between your knees for best comfort and to help blood flow to your baby. Avoid sleeping on your back, especially in the later months. You can also add extra pillows to support your back and belly. Keep your room cool and dark, avoid tea or coffee in the evening, and try relaxing activities like deep breathing or light reading. If you have trouble sleeping, talk to your health worker.
