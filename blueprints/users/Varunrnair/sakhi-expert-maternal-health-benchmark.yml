prompt: I am pregnant and live in a village. I’ve heard TB can be risky during pregnancy. How can I stay safe and protect my baby?
ideal: To protect yourself and your baby, get regular antenatal check-ups at the nearest health center and inform your provider if you have a cough lasting more than two weeks, weight loss, or fever. They may advise TB screening and treatment if needed. TB spreads mainly through inhalation from close and frequent contact with someone who is infectious, so understanding how it spreads helps you protect yourself. Maintain good nutrition and hygiene, and avoid close contact with people who have active TB. If you suspect exposure, visit the clinic to get screened promptly.
should:
- Response accurately describes the importance and recommended schedule for regular antenatal check-ups (ANC).
- Response mentions key assessments to be performed during pregnancy
- Recognizes the roles of healthcare providers involved in maternal care.
- Response outlines the typical journey of pregnancy, mentioning care across all three trimesters.
