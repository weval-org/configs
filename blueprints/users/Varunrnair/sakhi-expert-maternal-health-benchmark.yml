prompt: How can I know if my pregnancy is high-risk?
ideal: While its ideal to have regular check-ups with a healthcare provider, you can look out for certain signs and conditions that may indicate a high-risk pregnancy. These include being under 19 or over 35 years old, being pregnant for the first time at an older age, having a short stature, or being overweight, obese, or underweight. Regular antenatal check-ups make it easier nowadays to track any risk factors and catch concerns early. Your family history and any prior pregnancy history can also help identify risks. If you notice any of these factors or have concerns, consult a healthcare professional as soon as possible.
