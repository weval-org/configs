ideal: Most herbal teas and remedies should be avoided during pregnancy unless your doctor says they are safe. Some herbal teas, like ginger or peppermint, may be safe in small amounts, but others can be harmful to you or your baby. There is limited research on the safety of many herbs in pregnancy. Always tell your doctor about any herbal teas or remedies you are using or want to use. When in doubt, stick to regular foods and drinks.
