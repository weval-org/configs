prompt: Is it safe to take over-the-counter medicines like paracetamol for headaches?
ideal: Paracetamol can be used for headaches or fever in pregnancy, but only in the lowest dose for the shortest time, and only if your doctor says it’s needed. Do not take other painkillers like ibuprofen or aspirin unless your doctor prescribes them. Always check with your healthcare provider before taking any medicine, including over-the-counter pills or home remedies. Never use medicine from old prescriptions or from someone else. If you have any doubts, ask your doctor or health worker.
