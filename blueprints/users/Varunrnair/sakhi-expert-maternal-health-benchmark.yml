prompt: What important screenings should I do during pregnancy to keep myself and my baby healthy?
ideal: It is essential to screen for gestational diabetes, tuberculosis (TB), and Group B Streptococcus (GBS). These conditions require specific tests and treatments. In addition to these, routine antenatal care includes physical examination with weight and blood pressure checks at every visit, blood tests such as hemoglobin and blood group, infection screening, urine tests, and ultrasounds as advised. These investigations help detect complications early. Discuss with your healthcare provider or ASHA worker about test availability in your area and the steps to take if any condition is detected. Regular follow-ups ensure proper monitoring and treatment.
