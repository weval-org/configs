prompt: What types of exercises are safe to do during pregnancy?
ideal: Walking, gentle stretching, and pregnancy yoga are safe exercises during pregnancy. Aim for at least 30 minutes of light activity most days, unless your doctor says otherwise. Swimming and light cycling are also good options. Avoid heavy lifting, jumping, or contact sports. If you did strength training before pregnancy, continue only with light weights and after your doctor’s approval. Always listen to your body and stop if you feel dizzy or have pain. Drink plenty of water and avoid exercising in very hot weather.
