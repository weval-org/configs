prompt: What should I know about gaining weight during pregnancy?
ideal: Gaining the right amount of weight during pregnancy is important for both you and your baby. Most women should aim for about 11–16 kg, depending on their starting weight. A balanced diet—rich in fruits, vegetables, whole grains, and proteins—helps support healthy weight gain, while limiting junk food can prevent unnecessary excess. Regular antenatal check-ups allow your healthcare provider to monitor your weight and ensure you are on track throughout pregnancy.
