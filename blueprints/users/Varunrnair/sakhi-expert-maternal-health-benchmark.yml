prompt: I live far from the nearest health center. How can I make sure I get the care I need during pregnancy?
ideal: It’s tough when health centers are far away. To make sure you get the care you need, plan ahead and start prenatal care early, even if the journey is long. Talk to the health worker about your travel challenges—they can give you a schedule of important visits and help you find transportation. Early registration of pregnancy and seeking help from local health workers like ASHA workers will make it easier to get timely care. Along with this, maintain adequate nutrition, take iron and folic acid regularly, and follow the planned antenatal visit schedule. If you notice any symptoms that could complicate pregnancy, arrange travel and go to the hospital immediately.
