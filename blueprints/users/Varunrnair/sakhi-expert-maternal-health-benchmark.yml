prompt: Is it okay to sleep on my back while pregnant?
ideal: Sleep on your left side with a pillow between your knees for best comfort and to help blood flow to your baby. Avoid sleeping on your back, especially in the later months, as the weight of the uterus can press on major blood vessels and cause low blood pressure or dizziness. Use extra pillows to support your back and belly. Keep your room cool and dark, and avoid tea or coffee in the evening. Try to relax before bed with deep breathing or light reading. If you have trouble sleeping, talk to your health worker.
