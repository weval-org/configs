prompt: I feel so tired all the time, is this normal during pregnancy?
ideal: Feeling tired is very common during pregnancy, especially in the first few months, because your body is working hard to grow a baby. Make sure youre getting enough rest, eating nutritious meals, and drinking plenty of fluids. Short naps can also help. If youve had an antenatal check-up, your doctor may have already done blood tests to check for issues like anemia, which is common and can increase fatigue. Supplements given during antenatal visits can help address these concerns. If tiredness persists or worsens, speak to your doctor for further evaluation.
