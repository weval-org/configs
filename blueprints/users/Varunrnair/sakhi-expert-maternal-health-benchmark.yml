prompt: How often should I get tested for HIV and syphilis during pregnancy?
ideal: It’s important to get tested regularly during pregnancy. If you tested negative earlier, repeat HIV testing every 3 months and syphilis testing every 6 months, especially if there is any risk of exposure. Both infections should be tested at least once during routine antenatal care, usually at the first visit. If you have ongoing risk factors, repeat testing in the third trimester helps ensure you remain negative. If HIV is detected, treatment will continue throughout pregnancy, and testing is repeated each trimester for close monitoring.
