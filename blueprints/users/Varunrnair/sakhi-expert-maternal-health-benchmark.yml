prompt: I feel very tired and thirsty these days, could it harm my baby? I heard diabetes can happen during pregnancy.
ideal: Feeling very tired and thirsty can be signs of diabetes, including gestational diabetes that can occur during pregnancy. These symptoms alone aren’t enough, so proper testing by a health worker during antenatal check-ups is important. If diabetes is confirmed, it can often be managed with diet and exercise, though some women may need medicines. Managing it early is essential because untreated diabetes can harm both you and your baby.
