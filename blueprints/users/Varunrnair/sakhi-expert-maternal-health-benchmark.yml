prompt: What are sexually transmitted diseases?
ideal: Sexually transmitted diseases (STDs) are infections that can spread during sexual activities. Common STDs include syphilis, HIV, and gonorrhea. Some may cause sores, discharge, or pain, but many have no symptoms. Using barrier contraceptives like condoms helps prevent STDs, and free testing is available at government clinics if you are sexually active.
